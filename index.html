<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lify - Gestion de tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lify</h1>
            <p class="subtitle">Organisez votre vie, simplifiez vos tâches</p>
        </header>

        <main>
            <div class="task-form">
                <input type="text" id="taskInput" placeholder="Ajouter une nouvelle tâche...">
                <button id="addTaskBtn">Ajouter</button>
            </div>

            <ul id="taskList" class="task-list">
                <!-- Les tâches seront ajoutées ici dynamiquement -->
            </ul>
        </main>

        <footer>
            <p>Lify v1.0 - &copy; 2024 thaddeeboyogueno81-wq</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
